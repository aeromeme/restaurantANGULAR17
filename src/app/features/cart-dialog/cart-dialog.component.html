<h2>Carrito de compras</h2>
<div *ngIf="(cartItems$ | async) as items; else empty">
  <div class="cart-items">
    <div *ngFor="let item of items" class="cart-item">
      <div class="item-info">
        <span class="item-name">{{ item.product.name }}</span>
        <span class="item-price">${{ item.product.price }}</span>
      </div>
      <div class="quantity-controls">
        <button mat-icon-button (click)="updateQuantity(item.product.id, item.quantity - 1)" [disabled]="item.quantity <= 1">
          <mat-icon>remove</mat-icon>
        </button>
        <span class="quantity">{{ item.quantity }}</span>
        <button mat-icon-button (click)="updateQuantity(item.product.id, item.quantity + 1)">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="removeFromCart(item.product.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
      <div class="item-total">
        Total: ${{ (item.product.price * item.quantity).toFixed(2) }}
      </div>
    </div>
  </div>
  <div class="cart-total">
    <strong>Total del carrito: ${{ (cartTotal$ | async)?.toFixed(2) }}</strong>
  </div>
  <div class="cart-actions">
    <button mat-button color="warn" (click)="clearCart()">Vaciar carrito</button>
    <button mat-button (click)="close()">Cerrar</button>
  </div>
</div>
<ng-template #empty>
  <p>El carrito está vacío.</p>
  <button mat-button (click)="close()">Cerrar</button>
</ng-template>
