<h1>Carrito de Compras</h1>
<mat-card *ngIf="(cartItems$ | async) as items; else empty">
  <mat-card-content>
    <div class="cart-items">
      <div *ngFor="let item of items" class="cart-item">
        <div class="item-info">
          <h3>{{ item.product.name }}</h3>
          <p>Precio: ${{ item.product.price }}</p>
          <p>Total: ${{ (item.product.price * item.quantity).toFixed(2) }}</p>
           <button mat-icon-button [class.favorite]="isFavorite(item.product.id!)()">
          <mat-icon>favorite</mat-icon>
        </button>
        </div>
        <div class="quantity-controls">
          <button mat-icon-button (click)="updateQuantity(item.product.id, item.quantity - 1)" [disabled]="item.quantity <= 1">
            <mat-icon>remove</mat-icon>
          </button>
          <span class="quantity">{{ item.quantity }}</span>
          <button mat-icon-button (click)="updateQuantity(item.product.id, item.quantity + 1)">
            <mat-icon>add</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="removeFromCart(item.product.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <div class="cart-total">
      <h2>Total: ${{ (cartTotal$ | async)?.toFixed(2) }}</h2>
    </div>
    <div class="cart-actions">
      <button mat-raised-button color="warn" (click)="clearCart()">Vaciar Carrito</button>
      <button mat-raised-button color="primary">Proceder al Pago</button>
    </div>
  </mat-card-content>
</mat-card>
<ng-template #empty>
  <mat-card>
    <mat-card-content>
      <p>Tu carrito está vacío.</p>
      <button mat-raised-button routerLink="/product-list">Ver Productos</button>
    </mat-card-content>
  </mat-card>
</ng-template>
