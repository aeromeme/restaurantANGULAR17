<mat-card class="task-card">
  <mat-card-header>
    <mat-card-title>Lista de Tareas</mat-card-title>
    <mat-card-subtitle>Administra tus tareas pendientes</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="add-task-section">
      <mat-form-field appearance="outline" class="task-input">
        <mat-label>Nueva tarea</mat-label>
        <input matInput #taskInput type="text" placeholder="Escribe una nueva tarea" />
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="addTask(taskInput.value); taskInput.value=''">
        <mat-icon>add</mat-icon>
        Agregar
      </button>
    </div>

    <mat-list class="task-list">
      <mat-list-item *ngFor="let task of tasks(); let i = index" class="task-item">
        <div class="task-item-content">
          <div class="task-text">
            <span [class.done]="task.done">{{ task.title }}</span>
            <mat-chip-set>
              <mat-chip [color]="task.done ? 'accent' : 'warn'">
                {{ task.done ? 'Completada' : 'Pendiente' }}
              </mat-chip>
            </mat-chip-set>
          </div>
          <div class="task-actions">
            <button mat-icon-button [color]="task.done ? 'warn' : 'accent'" (click)="toggleTask(i)" [matTooltip]="task.done ? 'Marcar como pendiente' : 'Marcar como completada'">
              <mat-icon>{{ task.done ? 'undo' : 'check' }}</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="removeTask(i)" matTooltip="Eliminar tarea">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      </mat-list-item>
    </mat-list>

    <div class="summary" *ngIf="tasks().length > 0">
      <mat-chip color="primary">
        Tareas totales: {{ tasks().length }}
      </mat-chip>
      <mat-chip color="accent">
        Pendientes: {{ pendingCount() }}
      </mat-chip>
      <mat-chip color="primary">
        Completadas: {{ tasks().length - pendingCount() }}
      </mat-chip>
    </div>
  </mat-card-content>
</mat-card>
